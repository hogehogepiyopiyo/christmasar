<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Christmas AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }

    :root { --vh: 100vh; }
    @supports (height: 100dvh) { :root { --vh: 100dvh; } }
    html, body { width: 100%; height: 100%; }

    a-scene {
      position: fixed !important;
      left: 0; top: 0;
      width: 100vw !important;
      height: var(--vh) !important;
      z-index: 1;
    }
    .a-canvas, canvas.a-canvas {
      width: 100vw !important;
      height: var(--vh) !important;
      display: block !important;
    }

    #snowCanvas {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      display: none;
    }

    .frameLayer {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      display: none;
    }
    .frameLayer img{
      width: 100vw;
      height: var(--vh);
      object-fit: cover;
      display: block;
    }
    #frameBackLayer { opacity: 0.35; transform: scale(1.02); filter: blur(1px); }
    #frameFrontLayer { opacity: 0.95; }

    #wrongOverlay {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 76px);
      transform: translateX(-50%);
      z-index: 4;
      display: none;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(0,0,0,0.38);
      color: rgba(255,255,255,0.95);
      font-size: 14px;
      line-height: 1.4;
      text-shadow: 0 2px 10px rgba(0,0,0,0.65);
      pointer-events: none;
      max-width: min(92vw, 520px);
      text-align: center;
      white-space: pre-line;
    }

    #ui {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.65);
      z-index: 10;
    }
    #panel {
      width: min(560px, 90vw);
      color: #fff;
      background: rgba(20,20,24,0.78);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 16px;
      padding: 16px 16px 12px;
    }
    #panel h1 { font-size: 18px; margin: 0 0 8px; font-weight: 900; }
    #panel p { font-size: 14px; margin: 6px 0; line-height: 1.45; color: rgba(255,255,255,0.9); }
    #startBtn {
      margin-top: 10px;
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 0;
      background: rgba(255,255,255,0.92);
      color: #111;
      font-size: 16px;
      font-weight: 900;
    }

    #hint {
      position: fixed; left: 0; right: 0;
      bottom: env(safe-area-inset-bottom);
      padding: 10px 12px;
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.88);
      text-shadow: 0 2px 10px rgba(0,0,0,0.70);
      pointer-events: none;
      z-index: 5;
      display: none;
      white-space: pre-line;
    }
  </style>
</head>

<body>
  <div id="ui">
    <div id="panel">
      <h1>ヒント</h1>
      <p><b>見ておくべきカードを写して。</b></p>
      <p>1) START を押す</p>
      <p>2) カメラを許可する</p>
      <p>3) 2枚のカードのどちらかを映す</p>
      <button id="startBtn">START</button>
    </div>
  </div>

  <div id="hint">カードを映してください</div>

  <canvas id="snowCanvas"></canvas>

  <div id="frameBackLayer" class="frameLayer">
    <img src="./frame_back.png" alt="frame back">
  </div>
  <div id="frameFrontLayer" class="frameLayer">
    <img src="./frame_front.png" alt="frame front">
  </div>

  <div id="wrongOverlay">虚無コアラは考え事をしているだけ</div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; warmupTolerance: 2; missTolerance: 12;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true"
  >
    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <!-- 0=正解 / 1=失敗（逆なら入れ替え） -->
    <a-entity id="targetCorrect" mindar-image-target="targetIndex: 0"></a-entity>
    <a-entity id="targetWrong"   mindar-image-target="targetIndex: 1"></a-entity>
  </a-scene>

  <script>
    // ---- iPhoneのURLバー伸縮対策 ----
    function setVh() { document.documentElement.style.setProperty("--vh", window.innerHeight + "px"); }
    setVh();
    window.addEventListener("resize", setVh, { passive: true });
    window.addEventListener("orientationchange", setVh, { passive: true });

    const ui = document.getElementById("ui");
    const hint = document.getElementById("hint");
    const wrongOverlay = document.getElementById("wrongOverlay");
    const frameBackLayer = document.getElementById("frameBackLayer");
    const frameFrontLayer = document.getElementById("frameFrontLayer");
    const sceneEl = document.getElementById("scene");
    const targetCorrect = document.getElementById("targetCorrect");
    const targetWrong   = document.getElementById("targetWrong");

    function logMsg(msg) {
      hint.style.display = "block";
      hint.textContent = msg;
    }

    window.addEventListener("error", (e) => logMsg("エラー: " + (e.message || "不明")));
    window.addEventListener("unhandledrejection", (e) => {
      const m = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
      logMsg("起動失敗: " + m);
    });

    // ------------------------------
    // 雪（Canvas）
    // ------------------------------
    const snowCanvas = document.getElementById("snowCanvas");
    const ctx = snowCanvas.getContext("2d");

    let snowRunning = false;
    let rafId = null;
    let lastT = 0;

    const layers = [
      { count: 140, size: 1.2, speed: 40,  alpha: 0.30, drift: 10 },
      { count: 220, size: 1.6, speed: 70,  alpha: 0.50, drift: 18 },
      { count: 320, size: 2.2, speed: 110, alpha: 0.75, drift: 26 }
    ];
    const particles = [[], [], []];

    function resizeSnowCanvas() {
      const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
      snowCanvas.width = Math.floor(window.innerWidth * dpr);
      snowCanvas.height = Math.floor(window.innerHeight * dpr);
      snowCanvas.style.width = window.innerWidth + "px";
      snowCanvas.style.height = window.innerHeight + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function initParticles() {
      const w = window.innerWidth, h = window.innerHeight;
      for (let i = 0; i < layers.length; i++) {
        particles[i] = [];
        for (let k = 0; k < layers[i].count; k++) {
          particles[i].push({
            x: Math.random() * w,
            y: Math.random() * h,
            vx: (Math.random() - 0.5) * layers[i].drift,
            vy: layers[i].speed * (0.6 + Math.random() * 0.8),
            r: layers[i].size * (0.7 + Math.random() * 0.9)
          });
        }
      }
    }

    function snowStart() {
      if (snowRunning) return;
      snowRunning = true;
      snowCanvas.style.display = "block";
      resizeSnowCanvas();
      initParticles();
      lastT = performance.now();
      rafId = requestAnimationFrame(tickSnow);
    }

    function snowStop() {
      snowRunning = false;
      snowCanvas.style.display = "none";
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }

    function tickSnow(t) {
      if (!snowRunning) return;
      const dt = Math.min(0.05, (t - lastT) / 1000);
      lastT = t;

      const w = window.innerWidth, h = window.innerHeight;
      ctx.clearRect(0, 0, w, h);

      for (let i = 0; i < layers.length; i++) {
        const L = layers[i];
        ctx.fillStyle = `rgba(255,255,255,${L.alpha})`;
        for (const p of particles[i]) {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx += (Math.random() - 0.5) * 6 * dt;
          p.vx = Math.max(-L.drift, Math.min(L.drift, p.vx));

          if (p.y > h + 10) { p.y = -10; p.x = Math.random() * w; p.vx = (Math.random() - 0.5) * L.drift; }
          if (p.x < -20) p.x = w + 20;
          if (p.x > w + 20) p.x = -20;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      rafId = requestAnimationFrame(tickSnow);
    }

    window.addEventListener("resize", () => {
      if (!snowRunning) return;
      resizeSnowCanvas();
      initParticles();
    }, { passive: true });

    // ------------------------------
    // 表示
    // ------------------------------
    let locked = false;

    function showIdle() {
      if (locked) return;
      wrongOverlay.style.display = "none";
      frameBackLayer.style.display = "none";
      frameFrontLayer.style.display = "none";
      snowStop();
      logMsg("カードを映してください");
    }

    function showWrong() {
      locked = false;
      frameBackLayer.style.display = "none";
      frameFrontLayer.style.display = "none";
      snowStop();
      wrongOverlay.style.display = "block";
      wrongOverlay.textContent = "虚無コアラは考え事をしているだけ\nほんとはかまってほしいかも";
      logMsg("別のカードも試してみて");
    }

    function showCorrect({lock = true} = {}) {
      wrongOverlay.style.display = "none";
      frameBackLayer.style.display = "block";
      frameFrontLayer.style.display = "block";
      snowStart();
      locked = !!lock;
      logMsg("なみだコアラはさみしがりやで\nいじっぱり\nすなおじゃないけど\nほんとはいっしょにいたい");
    }

    document.addEventListener("click", () => {
      if (!locked) return;
      locked = false;
      showIdle();
    }, { passive: true });

    // ------------------------------
    // 起動（START）
    // ★ここが今回の本命：targets.mindを必ず取り直す＆小さければ止める
    // ------------------------------
    document.getElementById("startBtn").addEventListener("click", async () => {
      ui.style.display = "none";
      hint.style.display = "block";
      logMsg("初期化中…");

      try {
        if (!sceneEl.hasLoaded) {
          await new Promise((res) => sceneEl.addEventListener("loaded", res, { once: true }));
        }

        // キャッシュ回避して targets を確認
        const v = Date.now();
        const targetSrc = `./targets.mind?v=${v}`;

        // mindar-image属性も同じURLに合わせる（重要）
        sceneEl.setAttribute("mindar-image", `imageTargetSrc: ${targetSrc}; warmupTolerance: 2; missTolerance: 12;`);

        // 実体チェック：小さい場合はほぼHTML(404等)
        const res = await fetch(targetSrc, { cache: "no-store" });
        const buf = await res.arrayBuffer();
        const type = res.headers.get("content-type") || "";
        logMsg(`targets: ${res.status} / ${type} / ${buf.byteLength} bytes`);

        if (!res.ok) {
          throw new Error(`targets.mind の取得に失敗（HTTP ${res.status}）`);
        }
        if (buf.byteLength < 100000) {
          throw new Error(`targets.mind が小さすぎます（${buf.byteLength} bytes）。404ページ等を読んでいる可能性が高いです。`);
        }

        const mindarSystem = sceneEl.systems["mindar-image-system"];
        if (!mindarSystem) throw new Error("mindar-image-system が見つかりません");

        await mindarSystem.start();

        // iPhoneのレイアウト崩れ対策
        window.dispatchEvent(new Event("resize"));

        // 黒画面回避の保険
        if (sceneEl.sceneEl?.renderer && !sceneEl.__loopStarted) {
          sceneEl.__loopStarted = true;
          sceneEl.sceneEl.renderer.setAnimationLoop(() => {
            sceneEl.sceneEl.render(sceneEl.sceneEl.object3D, sceneEl.sceneEl.camera);
          });
        }

        logMsg("カードを映してください");
      } catch (err) {
        logMsg("起動失敗: " + (err?.message || String(err)));
      }
    });

    // ------------------------------
    // 判定（誤判定を減らしつつ、認識しづらくしすぎない設定）
    // ------------------------------
    const STABLE_CORRECT_MS = 350;
    const STABLE_WRONG_MS   = 250;
    const WRONG_COOLDOWN_MS = 500;

    let correctVisible = false, wrongVisible = false;
    let correctSince = 0, wrongSince = 0, lastWrongAt = 0;

    const nowMs = () => performance.now();

    function updateDecision() {
      const t = nowMs();
      if (locked) return;

      if (wrongVisible && (t - wrongSince) >= STABLE_WRONG_MS) {
        showWrong();
        return;
      }

      if (correctVisible &&
          (t - correctSince) >= STABLE_CORRECT_MS &&
          (t - lastWrongAt)  >= WRONG_COOLDOWN_MS) {
        showCorrect({lock: true});
        return;
      }

      showIdle();
    }

    targetCorrect.addEventListener("targetFound", () => {
      correctVisible = true;
      if (!correctSince) correctSince = nowMs();
      updateDecision();
    });
    targetCorrect.addEventListener("targetLost", () => {
      correctVisible = false;
      correctSince = 0;
      updateDecision();
    });

    targetWrong.addEventListener("targetFound", () => {
      wrongVisible = true;
      const t = nowMs();
      if (!wrongSince) wrongSince = t;
      lastWrongAt = t;
      if (locked) locked = false;
      updateDecision();
    });
    targetWrong.addEventListener("targetLost", () => {
      wrongVisible = false;
      wrongSince = 0;
      updateDecision();
    });

    showIdle();
  </script>
</body>
</html>
