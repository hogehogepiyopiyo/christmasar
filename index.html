<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Christmas AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- MindAR (Image Tracking + A-Frame integration) -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }

    /* A-Frame（カメラ映像） */
    a-scene {
      position: fixed !important;
      inset: 0;
      z-index: 1;
    }

    /* 雪（canvas）＝カメラ映像の上 */
    #snowCanvas {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      display: none;
    }

    /* フレーム（HTML画像）＝雪の上 */
    .frameLayer {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      display: none;
    }
    .frameLayer img{
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }
    #frameBackLayer { opacity: 0.35; transform: scale(1.02); filter: blur(1px); }
    #frameFrontLayer { opacity: 0.95; }

    /* 失敗時テキスト（フレームより上） */
    #wrongOverlay {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 76px);
      transform: translateX(-50%);
      z-index: 4;
      display: none;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(0,0,0,0.38);
      color: rgba(255,255,255,0.95);
      font-size: 14px;
      line-height: 1.4;
      text-shadow: 0 2px 10px rgba(0,0,0,0.65);
      pointer-events: none;
      max-width: min(92vw, 520px);
      text-align: center;
      white-space: pre-line; /* \n 改行を反映 */
    }

    /* START画面 */
    #ui {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.65);
      z-index: 10;
    }
    #panel {
      width: min(560px, 90vw);
      color: #fff;
      background: rgba(20,20,24,0.78);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 16px;
      padding: 16px 16px 12px;
    }
    #panel h1 { font-size: 18px; margin: 0 0 8px; font-weight: 900; }
    #panel p { font-size: 14px; margin: 6px 0; line-height: 1.45; color: rgba(255,255,255,0.9); }
    #startBtn {
      margin-top: 10px;
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 0;
      background: rgba(255,255,255,0.92);
      color: #111;
      font-size: 16px;
      font-weight: 900;
    }

    /* 下のヒント表示 */
    #hint {
      position: fixed; left: 0; right: 0;
      bottom: env(safe-area-inset-bottom);
      padding: 10px 12px;
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.88);
      text-shadow: 0 2px 10px rgba(0,0,0,0.70);
      pointer-events: none;
      z-index: 5;
      display: none;
      white-space: pre-line; /* \n 改行 */
    }
  </style>
</head>

<body>
  <!-- 導入UI -->
  <div id="ui">
    <div id="panel">
      <h1>ヒント</h1>
      <p><b>見ておくべきカードを写して。</b></p>
      <p>1) START を押す</p>
      <p>2) カメラを許可する</p>
      <p>3) 2枚のカードのどちらかを映す</p>
      <button id="startBtn">START</button>
    </div>
  </div>

  <div id="hint">カードを映してください</div>

  <!-- 雪（Canvas） -->
  <canvas id="snowCanvas"></canvas>

  <!-- フレーム（HTML） -->
  <div id="frameBackLayer" class="frameLayer">
    <img src="./frame_back.png" alt="frame back">
  </div>
  <div id="frameFrontLayer" class="frameLayer">
    <img src="./frame_front.png" alt="frame front">
  </div>

  <!-- 失敗テキスト -->
  <div id="wrongOverlay">虚無コアラは考え事をしているだけ</div>

  <!-- A-Frame / MindAR（追跡とカメラだけ担当） -->
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; warmupTolerance: 3; missTolerance: 8;"
    vr-mode-ui="enabled: false"
    renderer="colorManagement: true"
    embedded
  >
    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <!-- 重要：targets.mind の登録順に合わせる -->
    <!-- 0 = 正解カード / 1 = 失敗カード（逆ならここを入れ替える） -->
    <a-entity id="targetCorrect" mindar-image-target="targetIndex: 0"></a-entity>
    <a-entity id="targetWrong"   mindar-image-target="targetIndex: 1"></a-entity>
  </a-scene>

  <script>
    const ui = document.getElementById("ui");
    const hint = document.getElementById("hint");
    const sceneEl = document.getElementById("scene");

    const targetCorrect = document.getElementById("targetCorrect");
    const targetWrong = document.getElementById("targetWrong");

    const snowCanvas = document.getElementById("snowCanvas");
    const ctx = snowCanvas.getContext("2d");

    const frameBackLayer = document.getElementById("frameBackLayer");
    const frameFrontLayer = document.getElementById("frameFrontLayer");
    const wrongOverlay = document.getElementById("wrongOverlay");

    // 画面下にログを出す（iPhoneで原因切り分け用）
    function logMsg(msg) {
      hint.style.display = "block";
      hint.textContent = msg;
    }
    window.addEventListener("error", (e) => {
      logMsg("エラー: " + (e.message || "不明"));
    });
    window.addEventListener("unhandledrejection", (e) => {
      const m = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
      logMsg("起動失敗: " + m);
    });

    // 状態管理
    // idle -> まだ確定なし
    // wrong -> 失敗表示中
    // correct -> 正解表示中（ロック）
    let state = "idle";

    function showIdle() {
      if (state === "correct") return; // 正解ロック
      state = "idle";
      wrongOverlay.style.display = "none";
      frameBackLayer.style.display = "none";
      frameFrontLayer.style.display = "none";
      snowStop();
      logMsg("カードを映してください");
    }

    function showWrong() {
      if (state === "correct") return;
      state = "wrong";
      frameBackLayer.style.display = "none";
      frameFrontLayer.style.display = "none";
      snowStop();
      wrongOverlay.style.display = "block";
      wrongOverlay.textContent = "虚無コアラは考え事をしているだけ";
      logMsg("別のカードも試してみて");
    }

    function showCorrect() {
      state = "correct";
      wrongOverlay.style.display = "none";
      frameBackLayer.style.display = "block";
      frameFrontLayer.style.display = "block";
      snowStart();
      logMsg("メリークリスマス（スクショで保存）");
    }

    // ===== 雪（Canvas）: 3層で奥行き =====
    let snowRunning = false;
    let rafId = null;
    let lastT = 0;

    const layers = [
      { count: 140, size: 1.2, speed: 40,  alpha: 0.30, drift: 10 }, // 遠
      { count: 220, size: 1.6, speed: 70,  alpha: 0.50, drift: 18 }, // 中
      { count: 320, size: 2.2, speed: 110, alpha: 0.75, drift: 26 }  // 近
    ];
    const particles = [[], [], []];

    function resizeSnowCanvas() {
      const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
      snowCanvas.width = Math.floor(window.innerWidth * dpr);
      snowCanvas.height = Math.floor(window.innerHeight * dpr);
      snowCanvas.style.width = window.innerWidth + "px";
      snowCanvas.style.height = window.innerHeight + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function initParticles() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      for (let i = 0; i < layers.length; i++) {
        particles[i] = [];
        for (let k = 0; k < layers[i].count; k++) {
          particles[i].push({
            x: Math.random() * w,
            y: Math.random() * h,
            vx: (Math.random() - 0.5) * layers[i].drift,
            vy: layers[i].speed * (0.6 + Math.random() * 0.8),
            r: layers[i].size * (0.7 + Math.random() * 0.9)
          });
        }
      }
    }

    function snowStart() {
      if (snowRunning) return;
      snowRunning = true;
      snowCanvas.style.display = "block";
      resizeSnowCanvas();
      initParticles();
      lastT = performance.now();
      rafId = requestAnimationFrame(tickSnow);
    }

    function snowStop() {
      snowRunning = false;
      snowCanvas.style.display = "none";
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }

    function tickSnow(t) {
      if (!snowRunning) return;
      const dt = Math.min(0.05, (t - lastT) / 1000); // 最大50ms
      lastT = t;

      const w = window.innerWidth;
      const h = window.innerHeight;

      ctx.clearRect(0, 0, w, h);

      for (let i = 0; i < layers.length; i++) {
        const L = layers[i];
        ctx.fillStyle = `rgba(255,255,255,${L.alpha})`;

        for (const p of particles[i]) {
          // 動き
          p.x += p.vx * dt;
          p.y += p.vy * dt;

          // 風でゆらゆら
          p.vx += (Math.random() - 0.5) * 6 * dt;
          p.vx = Math.max(-L.drift, Math.min(L.drift, p.vx));

          // 画面外へ出たら上に戻す
          if (p.y > h + 10) {
            p.y = -10;
            p.x = Math.random() * w;
            p.vx = (Math.random() - 0.5) * L.drift;
          }
          if (p.x < -20) p.x = w + 20;
          if (p.x > w + 20) p.x = -20;

          // 描画（円）
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      rafId = requestAnimationFrame(tickSnow);
    }

    window.addEventListener("resize", () => {
      if (!snowRunning) return;
      resizeSnowCanvas();
      initParticles();
    });

    // ===== START押下でカメラ開始 =====
    document.getElementById("startBtn").addEventListener("click", async () => {
      ui.style.display = "none";
      hint.style.display = "block";
      logMsg("初期化中…");

      try {
        // sceneの読み込み完了を待つ（早押し対策）
        if (!sceneEl.hasLoaded) {
          await new Promise((res) => sceneEl.addEventListener("loaded", res, { once: true }));
        }

        const mindarSystem = sceneEl.systems["mindar-image-system"];
        if (!mindarSystem) {
          logMsg("mindar-image-system が見つかりません（読み込み失敗）");
          return;
        }

        await mindarSystem.start();
        logMsg("カードを映してください");

        // A-Frame描画ループ開始
        sceneEl.sceneEl.renderer.setAnimationLoop(() => {
          sceneEl.sceneEl.render(sceneEl.sceneEl.object3D, sceneEl.sceneEl.camera);
        });

      } catch (err) {
        logMsg("起動失敗: " + (err?.message || String(err)));
      }
    });

    // ===== マーカー分岐 =====
    targetCorrect.addEventListener("targetFound", () => showCorrect());
    targetWrong.addEventListener("targetFound", () => showWrong());

    targetCorrect.addEventListener("targetLost", () => {
      if (state === "correct") return; // 正解ロック
      showIdle();
    });

    targetWrong.addEventListener("targetLost", () => {
      if (state === "correct") return;
      showIdle();
    });
  </script>
</body>
</html>
